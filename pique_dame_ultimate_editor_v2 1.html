<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pique Dame Ultimate Editor V2</title><style>body{margin:0;height:100vh;display:flex;font-family:Arial,sans-serif;background:#1a1a1c}aside{width:430px;background:#242428;color:#fff;padding:14px;overflow:auto}.preview{flex:1;display:flex;align-items:center;justify-content:center}.poster{width:620px;height:900px;background:#f4f0e8;position:relative;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6)}.drag{position:absolute;cursor:move}.pillar{left:20%;top:-15%;width:24%;height:130%;background:#9c9993;transform:rotate(-7deg)}.shape{left:150px;top:30px;width:320px;height:320px;overflow:hidden;background:#fff}.shape img{width:100%;height:100%;object-fit:cover}.ctrl{margin:8px 0}input,textarea,select{width:100%}#headline,#credits,#venue,#schedule{position:absolute;color:#1a1817}#headline{left:60px;top:430px;font-size:92px;font-weight:900;transform:rotate(-22deg)}#credits{left:170px;top:520px;transform:rotate(-22deg)}#venue{left:250px;top:610px;font-size:28px;font-weight:900;transform:rotate(-22deg)}#schedule{left:260px;top:650px;font-size:10px;transform:rotate(-22deg)}</style></head><body><aside><h2>Pique Dame Ultimate Editor V2</h2><div class=ctrl>Headline<input id=t1 value='PIQUEDAME'></div><div class=ctrl>Credits<input id=t2 value='MIT JENNY JUGO UND RUD. FORSTER'></div><div class=ctrl>Venue<input id=t3 value='PHOEBUSPALAST'></div><div class=ctrl>Schedule<textarea id=t4>ANFANG: 4.00 6.15 8.30</textarea></div><div class=ctrl>Image URL<input id=imgurl></div><div class=ctrl>Upload Image<input type=file id=upload accept='image/*'></div><h3>Colors</h3><div class=ctrl>Background<input type=color id=bg value='#f4f0e8'></div><div class=ctrl>Pillar<input type=color id=pillarC value='#9c9993'></div><div class=ctrl>Headline<input type=color id=headC value='#1a1817'></div><div class=ctrl>Credits<input type=color id=credC value='#1a1817'></div><div class=ctrl>Venue<input type=color id=venueC value='#1a1817'></div><div class=ctrl>Schedule<input type=color id=schedC value='#1a1817'></div><h3>Portrait Shape</h3><select id=shapeType><option>Circle</option><option>Oval</option><option>Rounded Square</option><option>Diamond</option><option>Hexagon</option><option>Octagon</option><option>Star</option><option>Flower</option><option>Clover</option><option>Badge</option><option>Blob</option><option>Heart</option><option>Cloud</option><option>Burst</option></select><div class=ctrl>Morph<input type=range id=morph min=0 max=100 value=50></div><div class=ctrl>Size<input type=range id=size min=180 max=500 value=320></div><div class=ctrl>Rotation<input type=range id=rot min=0 max=360 value=0></div><div class=ctrl>Grayscale<input type=range id=gray min=0 max=100 value=0></div><div class=ctrl>Contrast<input type=range id=contrast min=50 max=200 value=100></div><div class=ctrl>Brightness<input type=range id=bright min=50 max=200 value=100></div><button onclick='window.print()'>Export</button></aside><div class=preview><div class=poster id=poster><div id=pillar class='drag pillar'></div><div id=shape class='drag shape'><img id=img></div><div id=headline class='drag'>PIQUEDAME</div><div id=credits class='drag'>MIT JENNY JUGO UND RUD. FORSTER</div><div id=venue class='drag'>PHOEBUSPALAST</div><div id=schedule class='drag'>ANFANG</div></div></div><script>function shapeApply(){let t=shapeType.value,m=+morph.value;shape.style.clipPath='none';shape.style.borderRadius='0';if(t==='Circle')shape.style.borderRadius=(50-m*.15)+'%';if(t==='Oval')shape.style.borderRadius='50%/'+(20+m*.3)+'%';if(t==='Rounded Square')shape.style.borderRadius=(5+m*.4)+'%';if(t==='Diamond'){let w=20+m*.2;shape.style.clipPath=`polygon(50% 0,${100-w}% 50%,50% 100%,${w}% 50%)`;}if(t==='Hexagon')shape.style.clipPath='polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)';if(t==='Octagon')shape.style.clipPath='polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)';if(t==='Star')shape.style.clipPath='polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)';if(t==='Flower'){let p=15+m*.4;shape.style.clipPath=`polygon(50% 0,65% ${p}%,90% 10%,82% 35%,100% 50%,82% 65%,90% 90%,65% ${100-p}%,50% 100%,35% ${100-p}%,10% 90%,18% 65%,0 50%,18% 35%,10% 10%,35% ${p}%)`;}if(t==='Clover')shape.style.clipPath='polygon(50% 8%,75% 0,100% 25%,92% 50%,100% 75%,75% 100%,50% 92%,25% 100%,0 75%,8% 50%,0 25%,25% 0)';if(t==='Badge')shape.style.clipPath='polygon(50% 0,62% 10%,78% 2%,88% 18%,100% 30%,92% 50%,100% 70%,88% 82%,78% 98%,62% 90%,50% 100%,38% 90%,22% 98%,12% 82%,0 70%,8% 50%,0 30%,12% 18%,22% 2%,38% 10%)';if(t==='Blob')shape.style.clipPath='polygon(10% 20%,45% 0,85% 10%,100% 45%,90% 85%,55% 100%,15% 90%,0 50%)';if(t==='Heart')shape.style.clipPath='polygon(50% 100%,0 50%,20% 10%,50% 30%,80% 10%,100% 50%)';if(t==='Cloud')shape.style.borderRadius=(35+m*.3)+'%';if(t==='Burst')shape.style.clipPath='polygon(50% 0,60% 20%,100% 10%,80% 50%,100% 90%,60% 80%,50% 100%,40% 80%,0 90%,20% 50%,0 10%,40% 20%)';}
function update(){headline.textContent=t1.value;credits.textContent=t2.value;venue.textContent=t3.value;schedule.textContent=t4.value;poster.style.background=bg.value;pillar.style.background=pillarC.value;headline.style.color=headC.value;credits.style.color=credC.value;venue.style.color=venueC.value;schedule.style.color=schedC.value;shape.style.width=size.value+'px';shape.style.height=size.value+'px';shape.style.transform='rotate('+rot.value+'deg)';img.style.filter=`grayscale(${gray.value}%) contrast(${contrast.value}%) brightness(${bright.value}%)`;if(imgurl.value)img.src=imgurl.value;shapeApply()}document.querySelectorAll('input,textarea,select').forEach(e=>e.addEventListener('input',update));upload.onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=x=>img.src=x.target.result;r.readAsDataURL(f)};update();document.querySelectorAll('.drag').forEach(el=>{let d=false,ox=0,oy=0;el.onmousedown=e=>{d=true;ox=e.offsetX;oy=e.offsetY};document.addEventListener('mousemove',e=>{if(!d)return;let r=poster.getBoundingClientRect();el.style.left=(e.clientX-r.left-ox)+'px';el.style.top=(e.clientY-r.top-oy)+'px'});document.addEventListener('mouseup',()=>d=false)});</script></body></html>
