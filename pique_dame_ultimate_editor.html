<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pique Dame Ultimate Editor</title><style>body{margin:0;height:100vh;display:flex;font-family:Arial,sans-serif;background:#1a1a1c}aside{width:430px;background:#242428;color:#fff;padding:14px;overflow:auto}.preview{flex:1;display:flex;align-items:center;justify-content:center}.poster{width:620px;height:900px;background:#f4f0e8;position:relative;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6)}.drag{position:absolute;cursor:move}.pillar{left:20%;top:-15%;width:24%;height:130%;background:#9c9993;transform:rotate(-7deg)}.shape{left:150px;top:30px;width:320px;height:320px;overflow:hidden;background:#fff}.shape img{width:100%;height:100%;object-fit:cover}.ctrl{margin:8px 0}input,textarea,select{width:100%}#headline,#credits,#venue,#schedule{position:absolute;color:#1a1817}#headline{left:60px;top:430px;font-size:92px;font-weight:900;transform:rotate(-22deg)}#credits{left:170px;top:520px;transform:rotate(-22deg)}#venue{left:250px;top:610px;font-size:28px;font-weight:900;transform:rotate(-22deg)}#schedule{left:260px;top:650px;font-size:10px;transform:rotate(-22deg)}</style></head><body><aside><h2>Pique Dame Ultimate Editor</h2><div class=ctrl>Headline<input id=t1 value='PIQUEDAME'></div><div class=ctrl>Credits<input id=t2 value='MIT JENNY JUGO UND RUD. FORSTER'></div><div class=ctrl>Venue<input id=t3 value='PHOEBUSPALAST'></div><div class=ctrl>Schedule<textarea id=t4>ANFANG: 4.00 6.15 8.30</textarea></div><div class=ctrl>Image URL<input id=imgurl></div><div class=ctrl>Upload Image<input type=file id=upload accept='image/*'></div><h3>Colors</h3><div class=ctrl>Background<input type=color id=bg value='#f4f0e8'></div><div class=ctrl>Pillar<input type=color id=pillarC value='#9c9993'></div><div class=ctrl>Headline<input type=color id=headC value='#1a1817'></div><div class=ctrl>Credits<input type=color id=credC value='#1a1817'></div><div class=ctrl>Venue<input type=color id=venueC value='#1a1817'></div><div class=ctrl>Schedule<input type=color id=schedC value='#1a1817'></div><h3>Portrait Shape</h3><div class=ctrl><select id=shapeType><option>Circle</option><option>Oval</option><option>Diamond</option><option>Hexagon</option><option>Flower</option><option>Blob</option></select></div><div class=ctrl>Size<input type=range id=size min=180 max=450 value=320></div><div class=ctrl>Rotation<input type=range id=rot min=0 max=360 value=0></div><div class=ctrl>Border Color<input type=color id=borderColor value='#ffffff'></div><div class=ctrl>Border Width<input type=range id=borderWidth min=0 max=20 value=0></div><button onclick='resetLayout()'>Reset Layout</button><button onclick='window.print()'>Export</button></aside><div class=preview><div class=poster id=poster><div id=pillar class='drag pillar'></div><div id=shape class='drag shape'><img id=img></div><div id=headline class='drag'>PIQUEDAME</div><div id=credits class='drag'>MIT JENNY JUGO UND RUD. FORSTER</div><div id=venue class='drag'>PHOEBUSPALAST</div><div id=schedule class='drag'>ANFANG: 4.00 6.15 8.30</div></div></div><script>function shapeApply(){shape.style.clipPath='none';shape.style.borderRadius='0';let t=shapeType.value;if(t==='Circle'){shape.style.borderRadius='50%'}if(t==='Oval'){shape.style.borderRadius='50%'}if(t==='Diamond'){shape.style.clipPath='polygon(50% 0,100% 50%,50% 100%,0 50%)'}if(t==='Hexagon'){shape.style.clipPath='polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)'}if(t==='Flower'){shape.style.clipPath='polygon(50% 0,65% 20%,90% 10%,80% 35%,100% 50%,80% 65%,90% 90%,65% 80%,50% 100%,35% 80%,10% 90%,20% 65%,0 50%,20% 35%,10% 10%,35% 20%)'}if(t==='Blob'){shape.style.clipPath='polygon(16% 24%,48% 0,85% 14%,100% 46%,89% 84%,51% 100%,16% 88%,0 53%)'}}function update(){headline.textContent=t1.value;credits.textContent=t2.value;venue.textContent=t3.value;schedule.textContent=t4.value;poster.style.background=bg.value;pillar.style.background=pillarC.value;headline.style.color=headC.value;credits.style.color=credC.value;venue.style.color=venueC.value;schedule.style.color=schedC.value;shape.style.width=size.value+'px';shape.style.height=size.value+'px';shape.style.transform='rotate('+rot.value+'deg)';shape.style.border=borderWidth.value+'px solid '+borderColor.value;if(imgurl.value)img.src=imgurl.value;shapeApply()}document.querySelectorAll('input,textarea,select').forEach(e=>e.addEventListener('input',update));upload.onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=x=>img.src=x.target.result;r.readAsDataURL(f)};update();document.querySelectorAll('.drag').forEach(el=>{let d=false,ox=0,oy=0;el.onmousedown=e=>{d=true;ox=e.offsetX;oy=e.offsetY};document.addEventListener('mousemove',e=>{if(!d)return;let r=poster.getBoundingClientRect();el.style.left=(e.clientX-r.left-ox)+'px';el.style.top=(e.clientY-r.top-oy)+'px'});document.addEventListener('mouseup',()=>d=false)});function resetLayout(){shape.style.left='150px';shape.style.top='30px';headline.style.left='60px';headline.style.top='430px';credits.style.left='170px';credits.style.top='520px';venue.style.left='250px';venue.style.top='610px';schedule.style.left='260px';schedule.style.top='650px';}</script></body></html>
