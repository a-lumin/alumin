<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pique Dame Poster Generator v3</title><style>body{margin:0;display:flex;height:100vh;background:#1a1a1c;font-family:Arial}aside{width:360px;background:#242428;color:#fff;padding:20px;overflow:auto}input,textarea{width:100%;padding:8px;margin:6px 0 12px}.preview{flex:1;display:flex;align-items:center;justify-content:center}.poster{width:620px;height:900px;background:#f4f0e8;position:relative;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}.pillar{position:absolute;top:-15%;left:20%;width:24%;height:130%;background:#9c9993;transform:rotate(-7deg)}.circle{position:absolute;top:8%;right:10%;width:52%;aspect-ratio:1;border-radius:50%;overflow:hidden;background:#fff;z-index:2}.circle img{width:100%;height:100%;object-fit:cover;filter:grayscale(100%) contrast(180%)}.type{position:absolute;left:10%;bottom:28%;width:155%;transform:rotate(-22deg);color:#1a1817;z-index:5}.h1{font-size:92px;font-weight:900;line-height:.8;text-transform:uppercase}.h2{font-size:14px;font-weight:800;padding-left:30%;letter-spacing:.12em;margin-top:8px}.venue{margin-left:36%;margin-top:24px}.h3{font-size:28px;font-weight:900}.h4{font-size:10px;letter-spacing:.1em}button{width:100%;padding:12px}</style></head><body><aside><h2>Pique Dame Generator</h2><input id=t1 value='PIQUEDAME'><input id=t2 value='MIT JENNY JUGO UND RUD. FORSTER'><input id=t3 value='PHOEBUSPALAST'><textarea id=t4>ANFANG: 4.00 6.15 8.30 SONNTAGS: 7.45 4.00 6.15 8.30</textarea><input id=imgurl value='https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=800&q=80'><button onclick='window.print()'>Export / Print</button></aside><div class='preview'><div class='poster'><div class='pillar'></div><div class='circle'><img id='img' src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=800&q=80'></div><div class='type'><div class='h1' id='p1'>PIQUEDAME</div><div class='h2' id='p2'>MIT JENNY JUGO UND RUD. FORSTER</div><div class='venue'><div class='h3' id='p3'>PHOEBUSPALAST</div><div class='h4' id='p4'>ANFANG: 4.00 6.15 8.30 SONNTAGS: 7.45 4.00 6.15 8.30</div></div></div></div></div><script>function u(){p1.textContent=t1.value;p2.textContent=t2.value;p3.textContent=t3.value;p4.textContent=t4.value;img.src=imgurl.value}document.querySelectorAll('input,textarea').forEach(e=>e.addEventListener('input',u));u();</script></body></html>
