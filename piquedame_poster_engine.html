<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pique Dame Poster Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Asap:ital,wght@0,400;0,700;0,900;1,700&family=Bebas+Neue&family=Cinzel:wght@700;900&family=Courier+Prime:wght@700&family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Major+Mono+Display&family=Monoton&family=Orbitron:wght@700;900&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Rubik+Glitch&family=Space+Grotesk:wght@700&family=Syne:wght@700;800&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-canvas: #1a1110;
      --bg-panel: #140d0c;
      --text-primary: #860111;
      --text-muted: #5e080f;
      --accent-base: #480607;
      --accent-active: #5f0809;
      --border-color: #32080a;
      --font-stack: "Asap", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0 !important;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      height: 100vh;
      width: 100vw;
      background: var(--bg-canvas);
      color: var(--text-primary);
      font-family: var(--font-stack);
      overflow: hidden;
      position: relative;
    }

    #shooting-star-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    #ui {
      width: 400px;
      min-width: 400px;
      height: 100%;
      background: var(--bg-panel);
      border-right: 1px solid var(--border-color);
      overflow-y: auto;
      padding: 28px 22px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      z-index: 20;
      position: relative;
    }

    .hero-header {
      display: flex;
      flex-direction: column;
      gap: 5px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 14px;
    }

    .hero-badge {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--accent-base);
    }

    .hero-title {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1.1;
      color: var(--text-primary);
    }

    .section-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .status-indicator {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #b71328;
      margin-top: 4px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    button, input[type="text"], .file-btn, select {
      width: 100%;
      height: 64px;
      background: var(--accent-base);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      font-family: var(--font-stack);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      cursor: pointer;
      outline: none;
      transition: background 150ms ease, border-color 150ms ease, color 150ms ease;
    }

    select {
      appearance: none;
      -webkit-appearance: none;
      background-image: url('data:image/svg+xml;utf8,<svg fill="%23860111" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
      background-repeat: no-repeat;
      background-position: right 14px center;
      cursor: pointer;
    }

    select option {
      background: #140d0c;
      color: #f4f0e8;
    }

    input[type="text"] {
      background: #0f0a09;
      cursor: text;
      text-transform: none;
      font-weight: 400;
      font-size: 13px;
    }

    input[type="text"]:focus, button:focus-visible, .file-btn:focus-visible, select:focus {
      border-color: var(--text-primary);
      color: #fff;
    }

    button:hover, .file-btn:hover, select:hover {
      background: var(--accent-active);
      border-color: var(--text-primary);
      color: #b71328;
    }

    button:active, .file-btn:active {
      background: #300304;
    }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn-row-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .btn-row-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .btn-row-4 button {
      height: 48px;
      font-size: 11px;
      padding: 0;
    }

    .color-swatch-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    .color-picker-box {
      height: 64px;
      background: #0f0a09;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
    }

    .color-picker-box span {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .color-picker-box input[type="color"] {
      border: 0;
      padding: 0;
      width: 32px;
      height: 24px;
      cursor: pointer;
      background: transparent;
    }

    input[type="file"] {
      display: none;
    }

    #stage {
      flex: 1;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
      padding: 40px;
      overflow: auto;
    }

    .stage-frame {
      padding: 12px;
      background: #0c0807;
      border: 1px solid var(--border-color);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      transform-origin: center center;
      transition: transform 200ms ease;
    }

    #poster {
      width: 700px;
      height: 1000px;
      min-width: 700px;
      min-height: 1000px;
      position: relative;
      overflow: hidden;
      background: #f4f0e8;
      transition: background 250ms ease;
    }

    #pillar, #portrait, #title, .meta {
      position: absolute;
    }

    #portrait {
      overflow: hidden;
      z-index: 2;
      transition: all 280ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    #portrait img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
      transform-origin: center center;
      transition: transform 200ms ease, filter 200ms ease;
    }

    #pillar {
      transition: all 250ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Big Headline Title: Base z-index 4 */
    #title {
      font-family: var(--font-stack);
      font-weight: 900;
      line-height: 0.88;
      letter-spacing: -0.04em;
      z-index: 4;
      text-transform: uppercase;
      word-break: break-word;
      cursor: grab;
      user-select: none;
      transform-origin: center center;
      transition: color 250ms ease, transform 240ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    #title:active {
      cursor: grabbing;
    }

    /* Small Metadata: Strict z-index 12 to always float OVER big typography if overlapping */
    .meta {
      z-index: 12;
      padding: 5px 8px;
      font-family: var(--font-stack);
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      pointer-events: none;
      line-height: 1.25;
      transition: color 200ms ease, background 200ms ease, border 200ms ease, box-shadow 200ms ease;
      white-space: normal;
      word-break: break-word;
    }

    /* Overlap state: distinct high-contrast badge rendering */
    .meta-overlapped {
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.38) !important;
      font-weight: 800 !important;
      letter-spacing: 0.07em !important;
    }

    .svg-shapes-def {
      position: absolute;
      width: 0;
      height: 0;
      pointer-events: none;
      opacity: 0;
    }

    @media (max-width: 1280px) {
      .stage-frame {
        transform: scale(0.8);
      }
    }

    @media (max-width: 1080px) {
      body {
        flex-direction: column-reverse;
        height: auto;
        min-height: 100vh;
        overflow-y: auto;
      }
      #ui {
        width: 100%;
        min-width: 100%;
        height: auto;
        border-right: none;
        border-top: 1px solid var(--border-color);
        padding: 24px 16px;
      }
      #stage {
        padding: 24px;
        height: 760px;
      }
      .stage-frame {
        transform: scale(0.68);
      }
    }

    @media (max-width: 768px) {
      #stage {
        height: 580px;
      }
      .stage-frame {
        transform: scale(0.5);
      }
      .btn-row, .btn-row-3, .color-swatch-row {
        grid-template-columns: 1fr;
      }
      .btn-row-4 {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
  <canvas id="shooting-star-canvas"></canvas>

  <svg class="svg-shapes-def" viewBox="0 0 100 100">
    <defs>
      <clipPath id="clip-heart" clipPathUnits="objectBoundingBox">
        <path d="M0.5,0.85 C0.1,0.55 0,0.35 0,0.22 C0,0.08 0.12,0 0.27,0 C0.37,0 0.45,0.06 0.5,0.15 C0.55,0.06 0.63,0 0.73,0 C0.88,0 1,0.08 1,0.22 C1,0.35 0.9,0.55 0.5,0.85 Z" />
      </clipPath>
      <clipPath id="clip-clover" clipPathUnits="objectBoundingBox">
        <path d="M 0.5,0.48 C 0.4,0.32 0.22,0.32 0.22,0.5 C 0.22,0.68 0.4,0.68 0.5,0.52 C 0.4,0.68 0.4,0.86 0.58,0.86 C 0.76,0.86 0.76,0.68 0.6,0.52 C 0.76,0.68 0.94,0.68 0.94,0.5 C 0.94,0.32 0.76,0.32 0.6,0.48 C 0.76,0.32 0.76,0.14 0.58,0.14 C 0.4,0.14 0.4,0.32 0.5,0.48 Z" />
      </clipPath>
      <clipPath id="clip-star" clipPathUnits="objectBoundingBox">
        <polygon points="0.5,0 0.63,0.35 1,0.36 0.71,0.58 0.81,0.95 0.5,0.72 0.19,0.95 0.29,0.58 0,0.36 0.37,0.35" />
      </clipPath>
      <clipPath id="clip-sparkle" clipPathUnits="objectBoundingBox">
        <path d="M 0.5,0 C 0.5,0.35 0.65,0.5 1,0.5 C 0.65,0.5 0.5,0.65 0.5,1 C 0.5,0.65 0.35,0.5 0,0.5 C 0.35,0.5 0.5,0.35 0.5,0 Z" />
      </clipPath>
      <clipPath id="clip-diamond" clipPathUnits="objectBoundingBox">
        <polygon points="0.5,0 1,0.5 0.5,1 0,0.5" />
      </clipPath>
      <clipPath id="clip-shield" clipPathUnits="objectBoundingBox">
        <path d="M 0,0 L 1,0 L 1,0.55 C 1,0.85 0.5,1 0.5,1 C 0.5,1 0,0.85 0,0.55 Z" />
      </clipPath>
      <clipPath id="clip-arch" clipPathUnits="objectBoundingBox">
        <path d="M 0,1 L 0,0.45 C 0,0.15 0.22,0 0.5,0 C 0.78,0 1,0.15 1,0.45 L 1,1 Z" />
      </clipPath>
    </defs>
  </svg>

  <aside id="ui">
    <div class="hero-header">
      <span class="hero-badge">System Core // V3.6 Contrast Safe</span>
      <h1 class="hero-title">PIQUE DAME</h1>
    </div>

    <div>
      <div class="section-label">Generator Core</div>
      <div class="control-group">
        <button id="gen">Generate All</button>
        <div class="btn-row">
          <button id="layout">New Layout</button>
          <button id="morph">Morph Art</button>
        </div>
      </div>
    </div>

    <div>
      <div class="section-label">
        <span>Dynamic Title & Contrast Layers</span>
      </div>
      <div class="control-group">
        <select id="fontSelect">
          <option value="" disabled selected>Select Curated Font...</option>
        </select>
        <div class="btn-row">
          <button id="titleBtn">New Phrase</button>
          <button id="fontBtn">Cycle Font</button>
        </div>
        <div class="btn-row">
          <button id="posTitleBtn">Reposition Title</button>
          <button id="rotTitleBtn">Angle Shift</button>
        </div>
        <div class="btn-row-4">
          <button id="alignLeft">Left</button>
          <button id="alignCenter">Center</button>
          <button id="alignRight">Right</button>
          <button id="layerTitleBtn">Toggle Layer</button>
        </div>
        <div class="status-indicator" id="fontStatus">Font: Asap Sharp Bold • Pos: Mid-Hero (0°)</div>
      </div>
    </div>

    <div>
      <div class="section-label">
        <span>Portrait Geometry & Crop</span>
      </div>
      <div class="control-group">
        <select id="shapeSelect">
          <option value="" disabled selected>Select Shape...</option>
        </select>
        <div class="btn-row">
          <button id="shapeBtn">Cycle Shape</button>
          <button id="shapeRandBtn">Random Shape</button>
        </div>
        <div class="status-indicator" id="shapeStatus">Shape: Full Rectangle</div>
      </div>
    </div>

    <div>
      <div class="section-label">Poster Color & Palettes</div>
      <div class="control-group">
        <select id="paletteSelect">
          <option value="" disabled selected>Select Curated Theme...</option>
        </select>
        <div class="btn-row">
          <button id="colors">Cycle Curated</button>
          <button id="randomPaletteBtn">Gen Harmonic</button>
        </div>
        <div class="color-swatch-row">
          <div class="color-picker-box">
            <span>Canvas</span>
            <input type="color" id="bgPicker">
          </div>
          <div class="color-picker-box">
            <span>Title</span>
            <input type="color" id="titlePicker">
          </div>
          <div class="color-picker-box">
            <span>Accent</span>
            <input type="color" id="accentPicker">
          </div>
        </div>
        <div class="status-indicator" id="paletteName">Active: Pique Crimson</div>
      </div>
    </div>

    <div>
      <div class="section-label">Curated Layout Presets</div>
      <div class="btn-row-3">
        <button id="presetMinimal">Clean</button>
        <button id="presetBrutal">Block</button>
        <button id="presetEditorial">Serif</button>
      </div>
    </div>

    <div>
      <div class="section-label">Subject & Framing</div>
      <div class="control-group">
        <input id="url" type="text" placeholder="Paste remote image URL...">
        <button id="load">Load Image URL</button>
        <div class="btn-row">
          <label class="file-btn" for="upload">Upload File</label>
          <input id="upload" type="file" accept="image/*">
          <label class="file-btn" for="camera">Camera</label>
          <input id="camera" type="file" accept="image/*" capture="user">
        </div>
        <div class="btn-row">
          <button id="zoomIn">Zoom In (+)</button>
          <button id="zoomOut">Zoom Out (-)</button>
        </div>
      </div>
    </div>
  </aside>

  <main id="stage">
    <div class="stage-frame">
      <div id="poster">
        <div id="pillar"></div>
        <div id="portrait"><img id="img" alt="Poster Subject"></div>
        <div id="title"></div>
        <div id="credits" class="meta"></div>
        <div id="venue" class="meta"></div>
        <div id="schedule" class="meta"></div>
      </div>
    </div>
  </main>

  <script>
    const POSTER_W = 700;
    const POSTER_H = 1000;
    const MARGIN = 36;

    const starCanvas = document.getElementById('shooting-star-canvas');
    const ctx = starCanvas.getContext('2d');
    let stars = [];
    let shootingStars = [];

    function resizeCanvas() {
      starCanvas.width = window.innerWidth;
      starCanvas.height = window.innerHeight;
      initStars();
    }

    function initStars() {
      stars = [];
      const count = Math.floor((starCanvas.width * starCanvas.height) / 6500);
      for (let i = 0; i < count; i++) {
        stars.push({
          x: Math.random() * starCanvas.width,
          y: Math.random() * starCanvas.height,
          radius: 0.6 + Math.random() * 1.2,
          alpha: 0.15 + Math.random() * 0.45
        });
      }
    }

    function spawnShootingStar() {
      if (shootingStars.length < 3 && Math.random() < 0.025) {
        shootingStars.push({
          x: Math.random() * starCanvas.width * 0.8,
          y: Math.random() * (starCanvas.height * 0.4),
          length: 70 + Math.random() * 90,
          speed: 9 + Math.random() * 7,
          angle: (Math.PI / 4) + (Math.random() * 0.16 - 0.08),
          alpha: 1
        });
      }
    }

    function renderStarfield() {
      ctx.clearRect(0, 0, starCanvas.width, starCanvas.height);
      ctx.fillStyle = '#480607';
      stars.forEach(s => {
        ctx.globalAlpha = s.alpha;
        ctx.fillRect(s.x, s.y, s.radius * 2, s.radius * 2);
      });

      spawnShootingStar();
      for (let i = shootingStars.length - 1; i >= 0; i--) {
        const s = shootingStars[i];
        const tailX = s.x - Math.cos(s.angle) * s.length;
        const tailY = s.y - Math.sin(s.angle) * s.length;

        const grad = ctx.createLinearGradient(tailX, tailY, s.x, s.y);
        grad.addColorStop(0, 'rgba(72, 6, 7, 0)');
        grad.addColorStop(1, 'rgba(134, 1, 17, ' + s.alpha + ')');

        ctx.strokeStyle = grad;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(tailX, tailY);
        ctx.lineTo(s.x, s.y);
        ctx.stroke();

        s.x += Math.cos(s.angle) * s.speed;
        s.y += Math.sin(s.angle) * s.speed;
        s.alpha -= 0.014;

        if (s.alpha <= 0 || s.x > starCanvas.width || s.y > starCanvas.height) {
          shootingStars.splice(i, 1);
        }
      }
      requestAnimationFrame(renderStarfield);
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    renderStarfield();

    const $ = id => document.getElementById(id);
    const title = $('title');
    const portrait = $('portrait');
    const img = $('img');
    const pillar = $('pillar');
    const poster = $('poster');
    const metas = [$('credits'), $('venue'), $('schedule')];
    const paletteName = $('paletteName');
    const paletteSelect = $('paletteSelect');
    const bgPicker = $('bgPicker');
    const titlePicker = $('titlePicker');
    const accentPicker = $('accentPicker');
    const fontSelect = $('fontSelect');
    const fontStatus = $('fontStatus');
    const shapeSelect = $('shapeSelect');
    const shapeStatus = $('shapeStatus');

    let zoom = 1;
    let currentPaletteIndex = 0;
    let currentFontIndex = 0;
    let currentShapeIndex = 0;

    let titleRotation = 0;
    let currentTitlePresetIndex = 0;
    let isTitleFront = true;

    // Boundary-safe dedicated meta zones across all 4 quadrants
    const metaZones = [
      { id: "top-left", x: MARGIN, y: MARGIN, w: 260, h: 56 },
      { id: "top-right", x: POSTER_W - MARGIN - 260, y: MARGIN, w: 260, h: 56 },
      { id: "bottom-left", x: MARGIN, y: POSTER_H - MARGIN - 64, w: 280, h: 56 },
      { id: "bottom-right", x: POSTER_W - MARGIN - 280, y: POSTER_H - MARGIN - 64, w: 280, h: 56 },
      { id: "mid-left", x: MARGIN, y: 720, w: 260, h: 56 },
      { id: "mid-right", x: POSTER_W - MARGIN - 260, y: 720, w: 260, h: 56 }
    ];

    const titleAnchorZones = [
      { id: "top", name: "Top Header", left: MARGIN, top: 110, width: POSTER_W - (MARGIN * 2), align: 'left', rot: 0 },
      { id: "mid", name: "Mid-Hero", left: MARGIN, top: 250, width: POSTER_W - (MARGIN * 2), align: 'left', rot: 0 },
      { id: "center", name: "Center Frame", left: MARGIN, top: 380, width: POSTER_W - (MARGIN * 2), align: 'center', rot: 0 },
      { id: "lower", name: "Lower Deck", left: MARGIN, top: 520, width: POSTER_W - (MARGIN * 2), align: 'left', rot: 0 },
      { id: "bottom", name: "Bottom Base", left: MARGIN, top: 620, width: POSTER_W - (MARGIN * 2), align: 'left', rot: 0 },
      { id: "angled", name: "Angled Slash", left: MARGIN + 12, top: 300, width: POSTER_W - (MARGIN * 2) - 24, align: 'left', rot: -4 },
      { id: "cant", name: "Ascending Cant", left: MARGIN + 12, top: 320, width: POSTER_W - (MARGIN * 2) - 24, align: 'center', rot: 4 }
    ];

    const fonts = [
      { name: 'Asap Sharp Bold', family: '"Asap", sans-serif' },
      { name: 'Fraunces Heavy Serif', family: '"Fraunces", serif' },
      { name: 'Cinzel Classical Roman', family: '"Cinzel", serif' },
      { name: 'Space Grotesk Modern', family: '"Space Grotesk", sans-serif' },
      { name: 'Syne Avant-Garde', family: '"Syne", sans-serif' },
      { name: 'Bebas Neue Display', family: '"Bebas Neue", sans-serif' },
      { name: 'Anton Swiss Impact', family: '"Anton", sans-serif' },
      { name: 'Playfair Editorial', family: '"Playfair Display", serif' },
      { name: 'Courier Prime Typewriter', family: '"Courier Prime", monospace' },
      { name: 'Orbitron Cyberpunk', family: '"Orbitron", sans-serif' },
      { name: 'Unifraktur Blackletter', family: '"UnifrakturMaguntia", cursive' },
      { name: 'Major Mono Monospace', family: '"Major Mono Display", monospace' },
      { name: 'Rubik Glitch Distorted', family: '"Rubik Glitch", cursive' },
      { name: 'Monoton Disco Linear', family: '"Monoton", cursive' }
    ];

    fonts.forEach((f, idx) => {
      const opt = document.createElement('option');
      opt.value = idx;
      opt.textContent = f.name;
      fontSelect.appendChild(opt);
    });

    const curatedPhrases = [
      ['PIQUE', 'DAME'],
      ['QUEEN OF', 'SPADES'],
      ['SECRET', 'CARDS'],
      ['SEVEN THREE', 'ACE'],

    function r(n) { return Math.floor(Math.random() * n); }

    function hslToHex(h, s, l) {
      l /= 100;
      const a = s * Math.min(l, 1 - l) / 100;
      const f = n => {
        const k = (n + h / 30) % 12;
        const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
        return Math.round(255 * color).toString(16).padStart(2, '0');
      };
      return `#${f(0)}${f(8)}${f(4)}`;
    }

    function getLuminance(hex) {
      const c = hex.replace('#', '');
      const rgb = [parseInt(c.substr(0, 2), 16), parseInt(c.substr(2, 2), 16), parseInt(c.substr(4, 2), 16)];
      return (0.299 * rgb[0] + 0.587 * rgb[1] + 0.114 * rgb[2]) / 255;
    }

    // Shrinks font size until big title fits within remaining poster boundaries
    function fit() {
      let s = 136;
      title.style.fontSize = s + 'px';
      
      const titleLeft = parseInt(title.style.left, 10) || MARGIN;
      const titleTop = parseInt(title.style.top, 10) || 200;
      
      const maxAvailableWidth = Math.max(200, POSTER_W - titleLeft - MARGIN);
      const maxAvailableHeight = Math.max(120, POSTER_H - titleTop - MARGIN);

      title.style.width = maxAvailableWidth + 'px';

      while ((title.scrollHeight > maxAvailableHeight || title.scrollWidth > maxAvailableWidth) && s > 24) {
        s -= 2;
        title.style.fontSize = s + 'px';
      }
      resolveTypographyCollisions();
    }

    function clampWithinPoster(x, y, w, h) {
      const clampedX = Math.max(MARGIN, Math.min(POSTER_W - MARGIN - w, x));
      const clampedY = Math.max(MARGIN, Math.min(POSTER_H - MARGIN - h, y));
      return { x: clampedX, y: clampedY };
    }

    function updateTitleTransform() {
      title.style.transform = `rotate(${titleRotation}deg)`;
      const currentPresetName = titleAnchorZones[currentTitlePresetIndex]?.name || 'Custom';
      fontStatus.textContent = `Font: ${fonts[currentFontIndex].name} • Pos: ${currentPresetName} (${titleRotation}°) [Layer: ${isTitleFront ? 'Front' : 'Behind'}]`;
    }

    function applyTitlePlacement(zone) {
      const safeWidth = Math.min(zone.width, POSTER_W - (MARGIN * 2));
      const clamped = clampWithinPoster(zone.left, zone.top, safeWidth, 200);

      title.style.left = clamped.x + 'px';
      title.style.top = clamped.y + 'px';
      title.style.width = safeWidth + 'px';
      title.style.textAlign = zone.align || 'left';
      titleRotation = zone.rot || 0;
      
      updateTitleTransform();
      fit();
    }

    function cycleTitlePlacement(idx = null) {
      if (idx !== null) {
        currentTitlePresetIndex = idx;
      } else {
        currentTitlePresetIndex = (currentTitlePresetIndex + 1) % titleAnchorZones.length;
      }
      applyTitlePlacement(titleAnchorZones[currentTitlePresetIndex]);
    }

    function cycleTitleRotation() {
      const angles = [0, -4, 4, -8, 8];
      const nextAngle = angles[(angles.indexOf(titleRotation) + 1) % angles.length];
      titleRotation = nextAngle !== undefined ? nextAngle : 0;
      updateTitleTransform();
      fit();
    }

    function toggleTitleLayering() {
      isTitleFront = !isTitleFront;
      title.style.zIndex = isTitleFront ? 4 : 1;
      updateTitleTransform();
      resolveTypographyCollisions();
    }

    // Interactive Dragging on Title
    let isDragging = false;
    let dragStartX, dragStartY, initialLeft, initialTop;

    title.addEventListener('mousedown', e => {
      isDragging = true;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      initialLeft = parseInt(title.style.left, 10) || MARGIN;
      initialTop = parseInt(title.style.top, 10) || 200;
      title.style.transition = 'none';
      e.preventDefault();
    });

    window.addEventListener('mousemove', e => {
      if (!isDragging) return;
      const scale = poster.getBoundingClientRect().width / POSTER_W;
      const dx = (e.clientX - dragStartX) / scale;
      const dy = (e.clientY - dragStartY) / scale;

      const titleWidth = title.offsetWidth || 300;
      const titleHeight = title.offsetHeight || 150;

      const minX = MARGIN;
      const maxX = POSTER_W - MARGIN - titleWidth;
      const minY = MARGIN;
      const maxY = POSTER_H - MARGIN - titleHeight;

      const newL = Math.max(minX, Math.min(maxX, initialLeft + dx));
      const newT = Math.max(minY, Math.min(maxY, initialTop + dy));

      title.style.left = newL + 'px';
      title.style.top = newT + 'px';
      resolveTypographyCollisions();
    });

    window.addEventListener('mouseup', () => {
      if (isDragging) {
        isDragging = false;
        title.style.transition = 'color 250ms ease, transform 240ms cubic-bezier(0.16, 1, 0.3, 1)';
        currentTitlePresetIndex = -1;
        fit();
        updateTitleTransform();
      }
    });

    function newTitle(top = null, bot = null) {
      if (top && bot) {
        title.innerHTML = `${top}<br>${bot}`;
      } else if (Math.random() > 0.45) {
        const pair = curatedPhrases[r(curatedPhrases.length)];
        title.innerHTML = `${pair[0]}<br>${pair[1]}`;
      } else {
        const wordA = wordBankA[r(wordBankA.length)];
        const wordB = wordBankB[r(wordBankB.length)];
        title.innerHTML = `${wordA}<br>${wordB}`;
      }
      fit();
    }

    function setFont(idx) {

    function applyPalette(bgColor, titleColor, accentColor, label = 'Custom Palette') {
      poster.style.background = bgColor;
      title.style.color = titleColor;
      pillar.style.background = accentColor;
      
      bgPicker.value = bgColor.length === 7 ? bgColor : '#1a1110';

    function setCuratedPalette(index) {
      currentPaletteIndex = (index + palettes.length) % palettes.length;
      const p = palettes[currentPaletteIndex];
      applyPalette(p.colors[0], p.colors[1], p.colors[2], p.name);
      paletteSelect.value = currentPaletteIndex;
    }

    function generateHarmonicPalette() {
      const baseHue = r(360);
      const mode = r(4);
      let bg, tc, ac, modeName;

      if (mode === 0) {
        bg = hslToHex(baseHue, 20, 8);
        tc = hslToHex((baseHue + 180) % 360, 95, 60);
        ac = hslToHex(baseHue, 40, 22);
        modeName = 'Harmonic Contrast';
      } else if (mode === 1) {
        bg = hslToHex(baseHue, 25, 94);
        tc = hslToHex((baseHue + 30) % 360, 85, 25);
        ac = hslToHex((baseHue + 180) % 360, 70, 45);
        modeName = 'Light Editorial';
      } else if (mode === 2) {
        bg = hslToHex(baseHue, 35, 12);
        tc = hslToHex((baseHue + 60) % 360, 100, 65);
        ac = hslToHex((baseHue + 210) % 360, 80, 40);
        modeName = 'Neon Clash';
      } else {
        bg = hslToHex(baseHue, 15, 10);
        tc = hslToHex((baseHue + 25) % 360, 90, 55);
        ac = hslToHex((baseHue - 25 + 360) % 360, 50, 28);
        modeName = 'Analogous Shift';
      }

      applyPalette(bg, tc, ac, modeName + ` (${baseHue}°)`);
    }

    // Dynamic Collision Resolver: checks if small metadata intersects with big typography
    function resolveTypographyCollisions() {
      const posterRect = poster.getBoundingClientRect();
      if (!posterRect.width) return;
      const scale = posterRect.width / POSTER_W;

      const titleRect = title.getBoundingClientRect();
      const tBox = {
        left: (titleRect.left - posterRect.left) / scale,
        top: (titleRect.top - posterRect.top) / scale,
        right: (titleRect.right - posterRect.left) / scale,
        bottom: (titleRect.bottom - posterRect.top) / scale
      };

      const titleCol = titlePicker.value || '#860111';
      const bgCol = bgPicker.value || '#f4f0e8';
      const accentCol = accentPicker.value || '#480607';

      const isTitleDark = getLuminance(titleCol) < 0.45;
      const badgeBg = titleCol;
      const badgeText = isTitleDark ? '#ffffff' : '#0a0a0a';
      const badgeBorder = accentCol;

      metas.forEach(m => {
        const mLeft = parseFloat(m.style.left) || 0;
        const mTop = parseFloat(m.style.top) || 0;
        const mW = m.offsetWidth || parseFloat(m.style.width) || 200;
        const mH = m.offsetHeight || 40;

        const mBox = {
          left: mLeft,
          top: mTop,
          right: mLeft + mW,
          bottom: mTop + mH
        };

        // Bounding box overlap test with 8px buffer
        const overlap = !(
          mBox.right < tBox.left - 8 ||
          mBox.left > tBox.right + 8 ||
          mBox.bottom < tBox.top - 8 ||
          mBox.top > tBox.bottom + 8
        );

        if (overlap) {
          // Collision: Small font sits directly OVER big font with a distinct inverted color scheme
          m.classList.add('meta-overlapped');
          m.style.zIndex = '14';
          m.style.background = badgeBg;
          m.style.color = badgeText;
          m.style.border = `1px solid ${badgeBorder}`;
        } else {
          // No collision: Harmonious unbadged placement
          m.classList.remove('meta-overlapped');
          m.style.zIndex = '12';
          m.style.background = 'transparent';
          m.style.color = titleCol;
          m.style.border = 'none';
        }
      });
    }

    // Anti-collision placement: distributes metadata across non-overlapping zones
    function placeMeta() {
      const activePreset = titleAnchorZones[currentTitlePresetIndex]?.id || "mid";
      let candidateZones = [...metaZones];

      // Proactively deprioritize zones in direct conflict with title's chosen position
      if (activePreset === "top") {
        candidateZones = candidateZones.filter(z => !z.id.startsWith("top"));
      } else if (activePreset === "bottom" || activePreset === "lower") {
        candidateZones = candidateZones.filter(z => !z.id.startsWith("bottom"));
      } else if (activePreset === "center" || activePreset === "mid") {
        candidateZones = candidateZones.filter(z => !z.id.startsWith("mid"));
      }

      // Fallback if filtered list is too small
      if (candidateZones.length < 3) candidateZones = [...metaZones];

      // Shuffle candidates
      const chosen = candidateZones.sort(() => Math.random() - 0.5);
      const txt = [metaLine1[r(metaLine1.length)], metaLine2[r(metaLine2.length)], metaLine3[r(metaLine3.length)]];

      metas.forEach((m, i) => {
        const z = chosen[i % chosen.length];
        m.className = 'meta';
        m.textContent = txt[i];
        m.style.left = z.x + 'px';
        m.style.top = z.y + 'px';
        m.style.width = z.w + 'px';
        m.style.fontSize = (11 + r(3)) + 'px';
      });

      // Run collision detection to verify and badge if any residual overlap exists
      setTimeout(resolveTypographyCollisions, 50);
    }

    function newLayout() {
      const safeAnchors = [
        { x: MARGIN + 10, y: 70, w: 320, h: 420 },
        { x: POSTER_W - MARGIN - 340, y: 80, w: 330, h: 430 },
        { x: 140, y: 120, w: 420, h: 460 },
        { x: MARGIN + 10, y: 380, w: 330, h: 440 },
        { x: POSTER_W - MARGIN - 330, y: 380, w: 320, h: 430 },
        { x: 120, y: 260, w: 460, h: 480 }
      ];
      const p = safeAnchors[r(safeAnchors.length)];
      portrait.style.left = p.x + 'px';
      portrait.style.top = p.y + 'px';
      portrait.style.width = p.w + 'px';
      portrait.style.height = p.h + 'px';

      const pWidth = 40 + r(80);
      pillar.style.left = (MARGIN + r(POSTER_W - (MARGIN * 2) - pWidth)) + 'px';
      pillar.style.top = '0px';
      pillar.style.width = pWidth + 'px';
      pillar.style.height = POSTER_H + 'px';
      pillar.style.transform = 'rotate(' + (r(16) - 8) + 'deg)';
      
      cycleTitlePlacement(r(titleAnchorZones.length));
      placeMeta();
    }

      img.style.transform = 'scale(' + zoom + ')';
